# 記事収集の設定。サイトは SKILL.md「1. サイト一覧」と同じ24サイト（追加・変更していない）。
# feeds:     RSS / Atom / 公式JSON。上から順に試す。
# sitemaps:  フィードで足りないときに使うニュースサイトマップ。
# どちらも取れない場合は、トップページの <link rel="alternate"> と robots.txt の Sitemap を自動で探す。

user_agent: "Mozilla/5.0 (compatible; vocab-collector/1.0; personal language-learning use)"

http:
  connect_timeout: 6        # 秒
  read_timeout: 20          # 秒
  max_retries: 2            # 再試行の上限（タイムアウト・5xx・429のみ）
  backoff_seconds: 3        # 再試行の待ち時間（回数に応じて倍）
  min_interval_seconds: 2.0 # 同じホストへのアクセス間隔（robots.txt の Crawl-delay が長ければそちら）
  parallel_sites: 2         # 同時に処理するサイト数（1サイト内は常に1本ずつ）

collect:
  per_site_limit: 15        # 1サイトで本文を取得する記事の上限（最初のテストは10〜20）
  max_age_days: 3           # 日付が分かる記事のうち、これより古いものは候補にしない
  blocked_ratio_to_skip: 0.5   # 読んだ記事の半分以上が購読制限ならそのサイトを打ち切る
  blocked_min_sample: 4        # 上の判定を始めるまでに読む記事数
  max_error_attempts: 3     # 失敗した記事を次回以降に再試行する上限

filter:
  min_chars:                # 本文がこれより短い記事は除外
    en: 1200
    fr: 1200
    es: 1200
    zh: 300                 # NHK中文は記事が短いため低め
  near_duplicate_hamming: 4 # 本文SimHashのハミング距離がこれ以下なら重複扱い

batch:                      # Claude に一度に渡す量（後から変更可）
  max_articles: 5
  max_chars:                # 1バッチの本文合計の上限（文字数）
    en: 22000
    fr: 22000
    es: 22000
    zh: 9000
  article_max_chars:        # 長い記事は段落の切れ目でここまでに切る
    en: 7000
    fr: 7000
    es: 7000
    zh: 3000

